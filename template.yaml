AWSTemplateFormatVersion: 2010-09-09
Description: >-
  observability
Transform:
- AWS::Serverless-2016-10-31

Resources:

  GetProjectExecutionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-project-executions.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Fetch project timeline task executions
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /task-execution/project/{projectId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-project-executions.ts

  GetAccountExecutionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-account-executions.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Fetch account timeline task executions
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /task-execution/account/{accountId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-account-executions.ts

  GetExecutionHeatmapFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-execution-heatmap.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Fetch heatmap of task executions
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
      Events:
        Api:
          Type: Api
          Properties:
            Path: /task-execution/heatmap/account/{accountId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-execution-heatmap.ts
  
  TaskExecutionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskExecution
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: occurredAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: projectTimelineGSI
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
            - AttributeName: occurredAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: accountTimelineGSI
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
            - AttributeName: occurredAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
Outputs:
  WebEndpoint:
    Description: API Gateway endpoint URL for Prod stage
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON
