AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  observability

Transform:
  - AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 100

Resources:
  GetProjectExecutionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-project-executions.handler
      Description: Fetch project timeline task executions
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-project-executions.ts

  GetAccountExecutionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-account-executions.handler
      Description: Fetch account timeline task executions
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-account-executions.ts

  GetExecutionHeatmapFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/get-execution-heatmap.handler
      Description: Fetch heatmap of task executions
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/get-execution-heatmap.ts

  StartTaskExecutionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/start-task-execution.handler
      Description: Start a new task execution
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/start-task-execution.ts

  FinishExecutionWithoutErrorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/finish-execution-without-error.handler
      Description: Finish a task execution without error
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/finish-execution-without-error.ts

  FinishExecutionWithErrorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/infrastructure/http/handlers/finish-execution-with-error.handler
      Description: Finish a task execution with error
      Environment:
        Variables:
          TASK_EXECUTION_TABLE: !Ref TaskExecutionTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/infrastructure/http/handlers/finish-execution-with-error.ts

  TaskExecutionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskExecution
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: occurredAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: projectTimelineGSI
          KeySchema:
            - AttributeName: projectId
              KeyType: HASH
            - AttributeName: occurredAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: accountTimelineGSI
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
            - AttributeName: occurredAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

Outputs:
  GetProjectExecutionsFunctionArn:
    Value: !GetAtt GetProjectExecutionsFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetProjectExecutionsFunctionArn"

  GetAccountExecutionsFunctionArn:
    Value: !GetAtt GetAccountExecutionsFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetAccountExecutionsFunctionArn"

  GetExecutionHeatmapFunctionArn:
    Value: !GetAtt GetExecutionHeatmapFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetExecutionHeatmapFunctionArn"

  StartTaskExecutionFunctionArn:
    Value: !GetAtt StartTaskExecutionFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StartTaskExecutionFunctionArn"

  FinishExecutionWithoutErrorFunctionArn:
    Value: !GetAtt FinishExecutionWithoutErrorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FinishExecutionWithoutErrorFunctionArn"

  FinishExecutionWithErrorFunctionArn:
    Value: !GetAtt FinishExecutionWithErrorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FinishExecutionWithErrorFunctionArn"
