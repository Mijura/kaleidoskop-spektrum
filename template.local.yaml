AWSTemplateFormatVersion: "2010-09-09"
Description: >-
    kaleidoskop (LOCAL)

Transform:
    - AWS::Serverless-2016-10-31

Globals:
    Function:
        Runtime: nodejs22.x
        Architectures:
            - x86_64
        MemorySize: 128
        Timeout: 100

Resources:
    LocalApi:
        Type: AWS::Serverless::Api
        Properties:
            StageName: local
            Cors:
                AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
                AllowHeaders: "'content-type'"
                AllowOrigin: "'*'"

    GetProjectExecutionsFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: .
            Handler: src/infrastructure/http/handlers/get-project-executions.handler
            Description: Fetch project timeline task executions (local)
            Environment:
                Variables:
                    TASK_EXECUTION_TABLE: ""
            Events:
                Api:
                    Type: Api
                    Properties:
                        RestApiId: !Ref LocalApi
                        Path: /task-execution/project/{projectId}
                        Method: GET
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: false
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/get-project-executions.ts

    GetAccountExecutionsFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: .
            Handler: src/infrastructure/http/handlers/get-account-executions.handler
            Description: Fetch account timeline task executions (local)
            Environment:
                Variables:
                    TASK_EXECUTION_TABLE: ""
            Events:
                Api:
                    Type: Api
                    Properties:
                        RestApiId: !Ref LocalApi
                        Path: /task-execution/all
                        Method: GET
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: false
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/get-account-executions.ts

    GetExecutionHeatmapFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: .
            Handler: src/infrastructure/http/handlers/get-execution-heatmap.handler
            Description: Fetch heatmap of task executions (local)
            Environment:
                Variables:
                    TASK_EXECUTION_TABLE: ""
            Events:
                Api:
                    Type: Api
                    Properties:
                        RestApiId: !Ref LocalApi
                        Path: /task-execution/heatmap
                        Method: GET
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: false
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/get-execution-heatmap.ts

    StartTaskExecutionFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: .
            Handler: src/infrastructure/http/handlers/start-task-execution.handler
            Description: Start a new task execution (local)
            Environment:
                Variables:
                    TASK_EXECUTION_TABLE: "TaskExecution"
            Events:
                Api:
                    Type: Api
                    Properties:
                        RestApiId: !Ref LocalApi
                        Path: /task-execution/started
                        Method: POST
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: false
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/start-task-execution.ts

    FinishExecutionWithoutErrorFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: .
            Handler: src/infrastructure/http/handlers/finish-execution-without-error.handler
            Description: Finish a task execution without error (local)
            Environment:
                Variables:
                    TASK_EXECUTION_TABLE: ""
            Events:
                Api:
                    Type: Api
                    Properties:
                        RestApiId: !Ref LocalApi
                        Path: /task-execution/finished
                        Method: POST
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: false
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/finish-execution-without-error.ts

    FinishExecutionWithErrorFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: .
            Handler: src/infrastructure/http/handlers/finish-execution-with-error.handler
            Description: Finish a task execution with error (local)
            Environment:
                Variables:
                    TASK_EXECUTION_TABLE: "TaskExecution"
            Events:
                Api:
                    Type: Api
                    Properties:
                        RestApiId: !Ref LocalApi
                        Path: /task-execution/finished-with-error
                        Method: POST
        Metadata:
            BuildMethod: esbuild
            BuildProperties:
                Minify: false
                Target: "es2020"
                Sourcemap: true
                EntryPoints:
                    - src/infrastructure/http/handlers/finish-execution-with-error.ts
